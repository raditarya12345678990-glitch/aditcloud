<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=http://172.235.246.205:5002/">
    <title>ADIT CLOUD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a16;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .redirect-box {
            text-align: center;
            background: #16162e;
            padding: 40px 50px;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
        }
        .redirect-box .logo {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .redirect-box h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .redirect-box p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .redirect-box .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        .redirect-box .url {
            color: #64748b;
            font-size: 13px;
            font-family: monospace;
            background: #0a0a16;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            word-break: break-all;
        }
        .redirect-box .btn {
            display: inline-block;
            margin-top: 14px;
            padding: 10px 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .redirect-box .btn:hover {
            background: #1d4ed8;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="redirect-box">
        <div class="logo">☁️</div>
        <h1>ADIT CLOUD</h1>
        <p>Mengarahkan ke website...</p>
        <div class="spinner"></div>
        <div class="url">http://172.235.246.205:5002/</div>
        <a href="http://172.235.246.205:5002/" class="btn">Klik jika tidak otomatis</a>
    </div>

    <script>
        window.location.href = "http://172.235.246.205:5002/";
    </script>

</body>
</html>
